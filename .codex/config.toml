# Vibe-Trading is a separate NAS-hosted research engine. Codex may call only
# explicitly listed research tools. Broker connectors, Shadow Account, and
# unrestricted file or shell tools stay outside this integration. Swarm is
# intentionally enabled as an explicit, independent research workflow; the
# adapter restricts it to the repo-owned TCA research preset and starts it
# asynchronously.
[mcp_servers.vibe_trading]
command = "/home/admin_ryan/repo/Vibe-Trading/.venv-linux/bin/python"
args = ["/home/admin_ryan/repo/Trading-Copilot-Agent/.codex/vibe_trading_mcp.py"]
cwd = "/home/admin_ryan/repo/Trading-Copilot-Agent"
enabled_tools = [
  "list_skills",
  "load_skill",
  "list_swarm_presets",
  "run_swarm",
  "get_swarm_status",
  "get_run_result",
  "list_runs",
  "reap_stale_runs",
  "retry_run",
  "backtest",
  "factor_analysis",
  "analyze_options",
  "pattern_recognition",
  "get_market_data",
  "get_fund_flow",
  "get_dragon_tiger",
  "get_northbound_flow",
  "get_margin_trading",
  "get_block_trades",
  "get_shareholder_count",
  "get_lockup_expiry",
  "get_sector_info",
  "get_research_reports",
  "get_stock_news",
  "get_sec_filings",
  "get_financial_statements",
  "get_options_chain",
  "get_stock_profile",
  "screen_market",
  "search_symbol",
  "iwencai_search",
]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.vibe_trading.env]
LANGCHAIN_PROVIDER = "openai-codex"
LANGCHAIN_MODEL_NAME = "openai-codex/gpt-5.6-sol"
LANGCHAIN_REASONING_EFFORT = "medium"
VIBE_TRADING_GOAL_DB_PATH = "/home/admin_ryan/repo/Trading-Copilot-Agent/runtime/vibe-swarm/sessions.db"
VIBE_TRADING_ALLOWED_RUN_ROOTS = "/home/admin_ryan/repo/Trading-Copilot-Agent/runtime/vibe-swarm/runs"
VIBE_TRADING_ALLOWED_WRITE_ROOTS = "/home/admin_ryan/repo/Trading-Copilot-Agent/runtime/vibe-swarm/runs,/home/admin_ryan/repo/Trading-Copilot-Agent/report/research/vibe-swarm"
